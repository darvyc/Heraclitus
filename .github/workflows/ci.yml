name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy heraclitus
      - run: pytest --cov=heraclitus --cov-report=term-missing
      - run: python examples/basic_usage.py
      - run: python examples/llm_parameter.py
      - run: python examples/benchmark_adapter.py --hidden-size 32 --state-size 8 --memory-slots 4 --num-heads 2 --write-topk 1 --sequence-length 8 --iterations 1 --activate-output
      - run: python -m compileall -q heraclitus

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
