[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heraclitus"
version = "2.0.0"
description = "A multimodal predictive-state transformer parameter with stable higher-dimensional dynamics and low-rank correlated uncertainty."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "The Heraclitus Authors" }]
keywords = [
    "transformer",
    "large-language-model",
    "llm",
    "adapter",
    "predictive-state",
    "state-space",
    "mixture-model",
    "woodbury-identity",
    "householder",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "twine>=5.0",
]

[project.urls]
Repository = "https://github.com/darvyc/Heraclitus"
Documentation = "https://github.com/darvyc/Heraclitus/tree/main/docs"
Issues = "https://github.com/darvyc/Heraclitus/issues"

[tool.setuptools.packages.find]
include = ["heraclitus*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
heraclitus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["heraclitus"]
