[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heraclitus"
version = "0.2.0"
description = "An experimental 3D Dual-Flow Transformer with local adaptation, calibrated directional alignment, and frozen prior-state snapshots."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "The Heraclitus Authors" }]
keywords = ["transformer", "dual-flow", "counter-flow", "neural-networks", "sphere", "hebbian", "oja"]
dependencies = [
    "torch>=2.0",
    "numpy>=1.22",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["heraclitus*"]
exclude = ["tests*", "examples*", "docs*"]
